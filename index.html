<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière — モネの庭へようこそ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════
       カラーパレット — ジヴェルニーの庭
       ═══════════════════════════════ */
    :root {
      --sage:       #66ccaa;       /* メイン */
      --sage-dark:  #4aaa8a;
      --sage-deep:  #2d7a62;
      --sage-pale:  #a8e4d0;
      --sage-mist:  #d4f0e6;
      --sage-bg:    #e8f7f1;

      --cream:      #fdf8f0;
      --parchment:  #f5ede0;
      --warm-white: #fefcf8;

      --rose:       #d4788a;
      --rose-pale:  #f0c0c8;
      --wisteria:   #9a7ab8;
      --poppy:      #d45a40;
      --yellow:     #d4b44a;
      --green-deep: #2a5040;

      --ink:        #1e2e28;
      --text:       #2a3a32;
      --text-soft:  #4a6055;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--warm-white);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ══ ナビゲーション ══ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(254, 252, 248, 0.93);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(102, 204, 170, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      height: 64px;
    }

    .nav-logo {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1.55rem;
      color: var(--sage-deep);
      text-decoration: none;
      letter-spacing: 0.03em;
    }

    .nav-logo span {
      font-size: 0.6rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: normal;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-soft);
      vertical-align: middle;
      margin-left: 0.6rem;
      opacity: 0.7;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 0;
    }

    .nav-links a {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 1.4rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-soft);
      text-decoration: none;
      position: relative;
      transition: color 0.3s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 1.4rem; right: 1.4rem;
      height: 2px;
      background: var(--sage);
      transform: scaleX(0);
      transition: transform 0.35s ease;
    }

    .nav-links a:hover { color: var(--sage-deep); }
    .nav-links a:hover::after,
    .nav-links a.active::after { transform: scaleX(1); }
    .nav-links a.active { color: var(--sage-deep); font-weight: 500; }

    /* ══ ヒーロー ══ */
    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    /* 左：テキスト */
    .hero-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 4rem 6rem 5rem;
      background: var(--warm-white);
      position: relative;
      z-index: 2;
    }

    .hero-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--sage-dark);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.2s forwards;
    }

    .hero-title {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: clamp(3.2rem, 5.5vw, 5.5rem);
      line-height: 1.05;
      color: var(--ink);
      letter-spacing: -0.01em;
      opacity: 0;
      animation: fadeUp 1s ease 0.45s forwards;
    }

    .hero-title em {
      font-style: normal;
      color: var(--sage);
      display: block;
    }

    .hero-divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(to right, var(--sage), var(--rose-pale));
      margin: 2rem 0;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.7s forwards;
    }

    .hero-sub {
      font-size: 0.97rem;
      line-height: 2.15;
      color: var(--text-soft);
      max-width: 400px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.9s forwards;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 1.1s forwards;
    }

    .btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.8rem 2rem;
      transition: all 0.35s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--sage);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: var(--sage-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102,204,170,0.35);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-soft);
      border: 1px solid rgba(102,204,170,0.5);
    }

    .btn-outline:hover {
      border-color: var(--sage);
      color: var(--sage-deep);
      background: rgba(102,204,170,0.06);
    }

    /* 右：庭のビジュアル */
    .hero-visual {
      position: relative;
      background: linear-gradient(160deg, var(--sage-bg) 0%, var(--sage-mist) 40%, #c8eedd 100%);
      overflow: hidden;
    }

    /* 庭の葉っぱSVGパターン */
    .hero-visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse 60% 40% at 70% 60%, rgba(102,204,170,0.3) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 30% 40%, rgba(45,122,98,0.15) 0%, transparent 60%);
    }

    .garden-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* 池のリフレクション */
    .pond {
      position: absolute;
      bottom: 15%;
      left: 10%;
      right: 10%;
      height: 30%;
      background: linear-gradient(
        to bottom,
        rgba(102,204,170,0.4) 0%,
        rgba(45,122,98,0.6) 50%,
        rgba(30,46,40,0.5) 100%
      );
      border-radius: 50% / 30%;
      overflow: hidden;
    }

    .pond::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        rgba(255,255,255,0.06) 2px,
        transparent 4px
      );
      animation: rippleAnim 4s ease-in-out infinite;
    }

    @keyframes rippleAnim {
      0%, 100% { transform: skewX(0deg) translateX(0); }
      50% { transform: skewX(1deg) translateX(4px); }
    }

    /* 睡蓮 */
    .lily-pad {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 40%, #4aaa7a, #2a6a50);
      animation: floatPad 5s ease-in-out infinite;
    }

    @keyframes floatPad { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-5px) rotate(3deg)} }

    /* 花 */
    .flower {
      position: absolute;
      animation: sway 6s ease-in-out infinite;
    }

    @keyframes sway { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }

    /* ヒーロー右下デコ */
    .hero-season {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--green-deep);
      opacity: 0.5;
    }

    /* ══ セクション共通 ══ */
    section { padding: 5rem 2rem; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .sec-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--sage-dark);
      margin-bottom: 0.8rem;
    }

    .sec-title {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    /* ══ 季節の帯 ══ */
    .seasons-strip {
      background: var(--sage);
      padding: 1.5rem 2rem;
      overflow: hidden;
    }

    .seasons-inner {
      display: flex;
      align-items: center;
      gap: 3rem;
      animation: marquee 28s linear infinite;
      white-space: nowrap;
      width: max-content;
    }

    @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    .season-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: white;
    }

    .season-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); }

    /* ══ 引用 ══ */
    .quote-section {
      background: var(--parchment);
      border-top: 3px solid var(--sage-mist);
      border-bottom: 3px solid var(--sage-mist);
      text-align: center;
    }

    .quote-wrap {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
    }

    .quote-deco {
      font-family: 'IM Fell English', serif;
      font-size: 9rem;
      line-height: 0.6;
      color: var(--sage);
      opacity: 0.2;
      display: block;
      margin-bottom: 1rem;
    }

    blockquote {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: clamp(1.3rem, 2.2vw, 1.75rem);
      color: var(--ink);
      line-height: 1.75;
      margin-bottom: 1.5rem;
    }

    cite {
      font-size: 0.78rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--sage-dark);
      font-style: normal;
    }

    /* ══ ページカード ══ */
    .pages-section { background: var(--warm-white); }

    .pages-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-top: 3rem;
      border: 2px solid var(--sage-mist);
    }

    .page-card {
      padding: 2.5rem 2rem;
      background: white;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
      overflow: hidden;
      transition: background 0.35s;
    }

    .page-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--sage);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    .page-card:hover { background: var(--sage-bg); }
    .page-card:hover::before { transform: scaleX(1); }

    .card-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--sage-dark);
      opacity: 0.7;
      margin-bottom: 1.2rem;
    }

    .card-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--sage-mist);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
      transition: background 0.35s, transform 0.35s;
    }

    .page-card:hover .card-icon-wrap {
      background: var(--sage);
      transform: scale(1.08);
    }

    .card-title {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: var(--ink);
      margin-bottom: 0.6rem;
    }

    .card-desc {
      font-size: 0.87rem;
      line-height: 2;
      color: var(--text-soft);
    }

    .card-arrow {
      margin-top: 1.4rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sage-dark);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-arrow::after {
      content: '→';
      transition: transform 0.3s;
    }

    .page-card:hover .card-arrow::after { transform: translateX(4px); }

    /* ══ 代表作 ══ */
    .works-section {
      background: var(--sage-bg);
    }

    .works-inner {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 5rem;
      align-items: start;
    }

    .works-text p {
      font-size: 0.93rem;
      line-height: 2.2;
      color: var(--text-soft);
      margin-bottom: 1rem;
    }

    .works-list { margin-top: 0.5rem; }

    .work-item {
      display: grid;
      grid-template-columns: 50px 1fr;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(102,204,170,0.2);
      align-items: start;
      transition: background 0.3s;
      cursor: default;
    }

    .work-item:first-child { border-top: 1px solid rgba(102,204,170,0.2); }

    .work-year {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem;
      color: var(--sage-dark);
      padding-top: 0.2rem;
      letter-spacing: 0.05em;
    }

    .work-info {}

    .work-name {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink);
    }

    .work-location {
      font-size: 0.78rem;
      color: var(--text-soft);
      opacity: 0.6;
      margin-top: 0.15rem;
    }

    /* ══ モネの言葉 ══ */
    .words-section { background: var(--green-deep); color: white; }

    .words-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 3rem;
    }

    .word-card {
      padding: 2rem;
      border: 1px solid rgba(102,204,170,0.2);
      background: rgba(102,204,170,0.05);
    }

    .word-text {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.8;
      color: var(--sage-pale);
      margin-bottom: 1rem;
    }

    .word-source {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sage);
      opacity: 0.7;
    }

    /* ══ フッター ══ */
    footer {
      background: var(--ink);
      color: rgba(255,255,255,0.5);
      padding: 3rem 2rem;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: var(--sage);
      opacity: 0.8;
    }

    .footer-nav {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .footer-nav a {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-nav a:hover { color: var(--sage); }

    .footer-copy {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }

    /* ══ アニメーション ══ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }

    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }

    /* ══ レスポンシブ ══ */
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .hero-visual { height: 50vw; }
      .hero-text { padding: 7rem 2rem 3rem; }
      .pages-grid { grid-template-columns: 1fr; }
      .works-inner { grid-template-columns: 1fr; gap: 3rem; }
      .words-grid { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; gap: 1.5rem; text-align: center; }
      .footer-nav { justify-content: center; }
      nav { padding: 0 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- ── ナビ ── -->
  <nav>
    <a href="index.html" class="nav-logo">Lumière <span>Monet Fan Site</span></a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="blog.html">Journal</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <!-- ── ヒーロー ── -->
  <section class="hero">
    <!-- 左：テキスト -->
    <div class="hero-text">
      <p class="hero-tag">Claude Monet — 1840–1926</p>
      <h1 class="hero-title">
        光と庭の<br>
        <em>印象</em>
      </h1>
      <div class="hero-divider"></div>
      <p class="hero-sub">
        フランス・ジヴェルニーの庭に生きたクロード・モネ。<br>
        水面に揺れる光、季節ごとに咲く花々、
        そして永遠に描き続けた睡蓮——<br>
        彼が愛した色彩の世界へ。
      </p>
      <div class="hero-cta">
        <a href="gallery.html" class="btn btn-primary">Fan Gallery</a>
        <a href="blog.html" class="btn btn-outline">Journal を読む</a>
      </div>
    </div>

    <!-- 右：庭のビジュアル -->
    <div class="hero-visual">
      <svg class="garden-svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <!-- 空・霧 -->
        <defs>
          <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#d4f0e6"/>
            <stop offset="100%" stop-color="#a8e0cc"/>
          </radialGradient>
          <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
          <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>

        <!-- 背景 -->
        <rect width="600" height="800" fill="url(#skyGrad)"/>

        <!-- 木々（遠景） -->
        <ellipse cx="80" cy="220" rx="70" ry="120" fill="#5aaa7a" opacity="0.4" filter="url(#blur5)"/>
        <ellipse cx="520" cy="200" rx="80" ry="130" fill="#4a9a6a" opacity="0.35" filter="url(#blur5)"/>
        <ellipse cx="300" cy="180" rx="100" ry="100" fill="#66b888" opacity="0.3" filter="url(#blur5)"/>

        <!-- 木々（中景） -->
        <ellipse cx="100" cy="350" rx="55" ry="90" fill="#3a8a5a" opacity="0.65"/>
        <ellipse cx="500" cy="330" rx="60" ry="95" fill="#348a55" opacity="0.6"/>
        <ellipse cx="200" cy="340" rx="40" ry="70" fill="#4aaa72" opacity="0.55"/>
        <ellipse cx="420" cy="355" rx="45" ry="75" fill="#3a9a65" opacity="0.5"/>

        <!-- 柳 -->
        <line x1="160" y1="180" x2="160" y2="460" stroke="#2d6a40" stroke-width="5"/>
        <path d="M160 200 Q120 280 100 380" stroke="#4aaa6a" stroke-width="1.5" fill="none" opacity="0.7"/>
        <path d="M160 220 Q140 310 125 400" stroke="#5ab878" stroke-width="1.5" fill="none" opacity="0.65"/>
        <path d="M160 210 Q190 300 205 390" stroke="#4aaa6a" stroke-width="1.5" fill="none" opacity="0.6"/>
        <path d="M160 230 Q185 320 195 410" stroke="#5ab878" stroke-width="1.5" fill="none" opacity="0.6"/>
        <path d="M160 240 Q200 330 215 420" stroke="#3a9a58" stroke-width="1.5" fill="none" opacity="0.55"/>

        <!-- 池 -->
        <ellipse cx="300" cy="600" rx="250" ry="110" fill="#2a6a50" opacity="0.7"/>
        <ellipse cx="300" cy="600" rx="230" ry="95" fill="#338060" opacity="0.5"/>
        <!-- 水面の光反射 -->
        <ellipse cx="250" cy="580" rx="60" ry="15" fill="#66ccaa" opacity="0.25" filter="url(#blur2)"/>
        <ellipse cx="380" cy="620" rx="50" ry="12" fill="#88ddbb" opacity="0.2" filter="url(#blur2)"/>
        <!-- 波紋 -->
