<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Gallery — Lumière</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage:       #66ccaa;
      --sage-dark:  #4aaa8a;
      --sage-deep:  #2d7a62;
      --sage-pale:  #a8e4d0;
      --sage-mist:  #d4f0e6;
      --sage-bg:    #e8f7f1;
      --cream:      #fdf8f0;
      --parchment:  #f5ede0;
      --warm-white: #fefcf8;
      --ink:        #1e2e28;
      --text:       #2a3a32;
      --text-soft:  #4a6055;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--warm-white);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
    }

    /* ── ナビ ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(254,252,248,0.93);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(102,204,170,0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      height: 64px;
    }

    .nav-logo {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1.55rem;
      color: var(--sage-deep);
      text-decoration: none;
    }

    .nav-logo span {
      font-size: 0.6rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: normal;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-soft);
      vertical-align: middle;
      margin-left: 0.6rem;
      opacity: 0.7;
    }

    .nav-links {
      display: flex;
      list-style: none;
    }

    .nav-links a {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 1.4rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-soft);
      text-decoration: none;
      position: relative;
      transition: color 0.3s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 1.4rem; right: 1.4rem;
      height: 2px;
      background: var(--sage);
      transform: scaleX(0);
      transition: transform 0.35s ease;
    }

    .nav-links a:hover { color: var(--sage-deep); }
    .nav-links a:hover::after,
    .nav-links a.active::after { transform: scaleX(1); }
    .nav-links a.active { color: var(--sage-deep); }

    /* ── ページヘッダー ── */
    .page-header {
      padding: 8rem 2rem 3.5rem;
      text-align: center;
      border-bottom: 1px solid rgba(102,204,170,0.2);
    }

    .page-header-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--sage-dark);
      margin-bottom: 0.8rem;
    }

    .page-header h1 {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      color: var(--ink);
      margin-bottom: 0.6rem;
    }

    .page-header p {
      font-size: 0.88rem;
      color: var(--text-soft);
      line-height: 1.9;
    }

    /* ── ギャラリー本体 ── */
    .gallery-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3.5rem 2rem 6rem;
    }

    /* ── グリッド ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    /* ── 各アイテム ── */
    .gallery-item {
      display: flex;
      flex-direction: column;
    }

    .img-wrap {
      position: relative;
      overflow: hidden;
      background: var(--sage-mist);
      aspect-ratio: 4 / 3;
    }

    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover .img-wrap img {
      transform: scale(1.04);
    }

    /* 画像がない場合のプレースホルダー */
    .img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--sage-dark);
      opacity: 0.5;
    }

    .img-placeholder span {
      font-size: 2rem;
    }

    .img-placeholder p {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'Cormorant Garamond', serif;
    }

    /* キャプション */
    .gallery-caption {
      padding: 0.75rem 0 0;
    }

    .caption-title {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 0.2rem;
    }

    .caption-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-soft);
      opacity: 0.65;
    }

    /* ── フッター ── */
    footer {
      background: var(--ink);
      color: rgba(255,255,255,0.5);
      padding: 2.5rem 2rem;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--sage);
      opacity: 0.8;
    }

    .footer-nav {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .footer-nav a {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-nav a:hover { color: var(--sage); }
    .footer-copy { font-size: 0.7rem; letter-spacing: 0.1em; }

    /* ── レスポンシブ ── */
    @media (max-width: 768px) {
      nav { padding: 0 1.2rem; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      .footer-inner { flex-direction: column; gap: 1.2rem; text-align: center; }
      .footer-nav { justify-content: center; flex-wrap: wrap; }
    }

    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Lumière <span>Monet Fan Site</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
